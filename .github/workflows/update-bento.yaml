name: Bento

on:
  push:
    branches:
      - main

jobs:
  build-and-upload:
    name: Build & Upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.3.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Bento Components
        run: bun run build:bento

      - name: Create .env.local
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.local

      - name: Upload To Supabase
        run: bun run upload:bento

      - name: Build Package
        run: bun run build

      - name: Check if version is already published
        id: check_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Create .npmrc for authentication
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc

          # Check if version exists in registry
          if npm view @tamagui/bento@$VERSION version --registry=https://npm.pkg.github.com/ 2>/dev/null; then
            echo "Version $VERSION already published, skipping publish"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not published yet, will publish"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.check_version.outputs.should_publish == 'true'
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          VERSION="${{ steps.check_version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            PUBLISH_TAG=canary
          else
            PUBLISH_TAG=latest
          fi
          npm publish --registry=https://npm.pkg.github.com/ --tag "$PUBLISH_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
